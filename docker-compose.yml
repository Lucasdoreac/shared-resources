services:
  redis-local:
    image: redis:7.4.2
    container_name: redis-local
    restart: unless-stopped
    command:
      - "redis-server"
      - "--appendonly yes"
    entrypoint:
      - "docker-entrypoint.sh"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  redis-data:
    driver: local
