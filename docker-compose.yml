services:
  redis-local:
    image: redis:7.4.2
    container_name: redis-local
    restart: unless-stopped
    command:
      - "redis-server"
      - "--appendonly yes"
      - "--bind 0.0.0.0"  # Allow connections from any IP
    entrypoint:
      - "docker-entrypoint.sh"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  auth-service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    container_name: auth_service
    restart: unless-stopped
    ports:
      - "5050:5050"
    depends_on:
      - redis-local
    environment:
      - REDIS_HOST=redis-local
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis-local:6379/0

  mongo:
    image: mongo:6.0
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      
  internal_apis:
    build: &catalog_build
      context: ./internal_apis
      dockerfile: Dockerfile
      target: runtime
    container_name: internal_apis
    restart: unless-stopped
    ports:
      - "5081:5081"
    depends_on:
      redis-local:
        condition: service_healthy
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment: &catalog_environment
      REDIS_HOST: redis-local
      REDIS_PORT: 6379
      REDIS_URL: redis://redis-local:6379/0
      MONGO_URI: mongodb://mongo:27017/shared-resources
      MONGO_DATABASE: shared-resources
      API_KEY_LIST: ${API_KEY_LIST:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-user}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-password}
      GLOBAL_BUCKET_SIZE: ${GLOBAL_BUCKET_SIZE:-100}
      GLOBAL_QUEUE_NAME: ${GLOBAL_QUEUE_NAME:-}
      GLOBAL_LEAK_RATE: ${GLOBAL_LEAK_RATE:-0.1}

  global-bucket-worker:
    build: *catalog_build
    restart: unless-stopped
    command: ["poetry", "run", "python", "-m", "backpressure.leaky_bucket_worker"]
    environment: *catalog_environment
    depends_on:
      rabbitmq:
        condition: service_healthy


  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-local
    restart: unless-stopped
    ports:
      - "5672:5672"   # Porta para o protocolo AMQP
      - "15672:15672" # Porta para a interface de gerenciamento
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-user}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-password}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  redis-data:
    driver: local
  mongo-data:
    driver: local
  rabbitmq-data:
    driver: local
