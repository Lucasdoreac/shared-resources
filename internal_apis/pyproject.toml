[tool.poetry]
name = "shared-resources"
version = "0.1.0"
description = ""
authors = [
    "Danrley Pereira <danrleywillian@gmail.com>",
    "Guilherme Amaral <guilherme2004@gmail.com>"
]
readme = "README.md"
packages = [
    {include = "src", from = "."},
    {include = "DAL", from = "src"},
    {include = "BLL", from = "src"},
    {include = "SLL", from="src"},

]

[tool.poetry.dependencies]
python = "^3.14"
flask = "^3.1.3"
graphene = "^3.4.3"
graphql-server = {version = "^3.0.0", extras = ["flask"]}
python-dotenv = "^1.2.3"
mongoengine = "^0.29.3"
graphene-mongo = "^0.4.5"
flasgger = "^0.9.7.1"
gunicorn = "^26.2.0"
flask-caching = "^2.5.1"
redis = "^8.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
mongomock = "^4.3.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
